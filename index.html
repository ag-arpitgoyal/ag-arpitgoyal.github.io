<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Home page of Arpit Goyal">
  <title>Arpit Goyal</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1c1b19;
      --muted: #5c5852;
      --accent: #2f5d50;
      --card: #ffffff;
      --line: #e4e0d6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }

    nav {
      max-width: 880px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: var(--ink);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      color: var(--accent);
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.15;
      margin: 0 0 1rem;
    }

    .lede {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 38rem;
      margin: 0 0 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.5rem;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
    }

    p {
      margin: 0 0 1rem;
    }

    p:last-child {
      margin-bottom: 0;
    }

    footer {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 1.5rem 2.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a class="logo" href="./index.html">Arpit Goyal</a>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="https://github.com/ag-arpitgoyal">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Hello, welcome.</h1>
    <p class="lede">This is a simple home page for Arpit Goyal.</p>

    <section class="card" id="about">
      <h2>About</h2>
      <p>
        This site is hosted with GitHub Pages. More pages and projects can be
        added from here.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Arpit Goyal</p>
  </footer>
</body>
</html>
